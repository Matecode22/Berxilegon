<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/users.css}">
</head>
<body class="users-page">
<main class="users-card narrow">
    <header class="users-header">
        <div>
            <h1 class="users-title">Roles</h1>
            <p class="users-meta">Elige un rol para editar sus permisos.</p>
        </div>
        <div class="header-actions">
            <a class="btn btn-primary" th:href="@{/rol/new}">Crear rol</a>
        </div>
    </header>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <table class="table">
        <thead>
        <tr>
            <th>Rol</th>
            <th class="text-end">Permisos</th>
            <th class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rol : ${roles}">
            <td>
                <a class="user-link" th:href="@{/rol/{id}/permisos(id=${rol.id})}" th:text="${rol.nombre}">ROLE_ADMIN</a>
            </td>
            <td class="text-end text-muted" th:text="${#lists.size(rol.rolPermisos)}">0</td>
            <td class="text-end">
                <form method="post" th:action="@{/rol/{id}/delete(id=${rol.id})}">
                    <button class="btn btn-danger" type="submit">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(roles)}">
            <td class="text-muted text-center" colspan="3">No hay roles creados.</td>
        </tr>
        </tbody>
    </table>

    <footer class="users-footer">
        <a class="btn btn-outline" th:href="@{/usuario}">Volver a usuarios</a>
    </footer>
</main>
</body>
</html>
