<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear usuario</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1 class="auth-title">Crear usuario</h1>
    <p class="auth-subtitle">Define los datos y la contraseña de la nueva cuenta.</p>

    <form class="auth-form" th:object="${usuario}" method="post" th:action="@{/usuario}">
        <label class="field">
            <span class="field-label">Nombre</span>
            <input class="field-input" type="text" placeholder="Nombre completo" th:field="*{nombre}" required autofocus>
        </label>
        <label class="field">
            <span class="field-label">Correo</span>
            <input class="field-input" type="email" placeholder="usuario@correo.com" th:field="*{correo}"
                   autocomplete="off" required>
        </label>
        <label class="field">
            <span class="field-label">Contraseña</span>
            <input class="field-input" type="password" placeholder="••••••••" th:field="*{contrasena}"
                   autocomplete="new-password" required>
        </label>
        <label class="field">
            <span class="field-label">Ciudad</span>
            <input class="field-input" type="text" placeholder="Cali" th:field="*{ciudad}">
        </label>
        <label class="field">
            <span class="field-label">Contacto</span>
            <input class="field-input" type="text" placeholder="3001234567" th:field="*{contacto}">
        </label>
        <button class="btn-primary" type="submit">Crear usuario</button>
    </form>

    <p class="auth-footer">
        <a th:href="@{/usuario}">Volver a la lista de usuarios</a>
    </p>
</main>
</body>
</html>
