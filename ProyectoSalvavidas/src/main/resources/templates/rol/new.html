<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear rol</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1 class="auth-title">Crear rol</h1>
    <p class="auth-subtitle">Se guarda como ROLE_NOMBRE.</p>
    <form class="auth-form" th:object="${rol}" th:action="@{/rol}" method="post">
        <label class="field">
            <span class="field-label">Nombre</span>
            <input class="field-input" type="text" th:field="*{nombre}" placeholder="VENDEDOR" required>
        </label>
        <button class="btn-primary" type="submit">Crear</button>
    </form>
    <p class="auth-footer"><a th:href="@{/rol}">Volver a roles</a></p>
</main>
</body>
</html>
